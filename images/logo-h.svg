<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">DIGITAL-PRIME</title>
  <desc id="desc">Logo en forme de H stylisé</desc>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="36" fill="#0b1220"/>
  <!-- H shape -->
  <g filter="url(#glow)">
    <rect x="38" y="30" width="34" height="140" rx="12" fill="url(#g)"/>
    <rect x="128" y="30" width="34" height="140" rx="12" fill="url(#g)"/>
    <rect x="58" y="83" width="84" height="34" rx="12" fill="url(#g)"/>
  </g>
  <!-- subtle nodes -->
  <circle cx="55" cy="47" r="5" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="145" cy="153" r="5" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="100" cy="100" r="6" fill="#ffffff" opacity="0.95"/>
</svg>
